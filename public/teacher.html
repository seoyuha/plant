<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사 화면 · Garden Road Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2340;--mute:#6d6890;--line:#e2dcf3;--pri:#5a4fd0;--gold:#ffc53d;--red:#ef6b5b;--green:#3fb97a}
*{box-sizing:border-box}
body{margin:0;background:#f5f3fb;color:var(--ink);font-family:system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font-weight:800;color:var(--ink)}
button:hover{background:#faf9ff}
.pri{background:var(--pri);border-color:var(--pri);color:#fff}.pri:hover{background:#4c42b8}
.gold{background:var(--gold);border-color:#e0a614;color:#3a2600}
.red{background:#fff0ee;border-color:#f3c3bc;color:#b23b2b}
.sm{padding:5px 10px;font-size:13px}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.wrap{max-width:1300px;margin:0 auto;padding:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px #2a1f5a0a}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mute);font-size:14px}
h1,h2,h3{margin:0}
.jua{font-family:'Jua',sans-serif;font-weight:400}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.code{font-family:'Jua';font-size:56px;letter-spacing:8px;color:var(--pri);line-height:1}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700}
.chip b{font-family:'Jua';font-weight:400;font-size:24px;color:var(--pri);margin-right:4px}
.tabs{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}
.tabs .on{background:#ece8ff;border-color:var(--pri);color:var(--pri)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.team{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.team h3{font-family:'Jua';font-weight:400;font-size:24px;display:flex;justify-content:space-between;align-items:center}
.st{font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:#eee}
.st.playing{background:#dcffe9;color:#1d7a48}.st.paused{background:#fff3cd;color:#8a6200}.st.ended{background:#ffe1dc;color:#b23b2b}.st.waiting{background:#ece8ff;color:var(--pri)}
.kv{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;margin:8px 0;font-weight:700}
.bar{height:8px;border-radius:6px;background:#f0edf8;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7ee0b0,#ffc53d)}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#faf8ff;font-size:13px;color:var(--mute);position:sticky;top:0}
.ok{color:var(--green);font-weight:800}.no{color:var(--red);font-weight:800}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ccc;margin-right:4px}.dot.on{background:var(--green)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#ece8ff;color:var(--pri);font-size:12px;font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;display:none;z-index:9}
.big{background:linear-gradient(135deg,#2b2340,#4b3f8f);color:#fff;border-radius:20px;padding:24px;text-align:center}
.big .code{color:#ffd76e;font-size:96px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div id="toast"></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const T = { list: LS.get('rmd.t.classes', []), cur: null, data: null, tab: 'teams', poll: null, err: 0 };
  function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 3000); }
  async function api(p, data) {
    const r = await fetch('/api/' + p, data ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) } : {});
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { const e = Error(j.error || '서버에 연결하지 못했어요.'); e.status = r.status; throw e; }
    return j;
  }
  const STATUS = { waiting: '대기', playing: '진행 중', paused: '멈춤', ended: '끝' };

  /* ───── 처음 화면 ───── */
  function vHome() {
    return `<div class="top"><div><h1 class="jua" style="font-size:36px;color:var(--pri)">🌻 Garden Road Defense · 교사 화면</h1>
      <div class="muted">6학년 영어 9단원 <b>How Can I Get to the Museum?</b> 복습 게임 · 모둠별로 문제를 풀어 정원으로 가는 길을 막아요.</div></div></div>
    <div class="row" style="align-items:stretch">
      <div class="card" style="flex:1;min-width:300px">
        <h2 style="margin-bottom:12px">새 반 만들기</h2>
        <div class="row"><input id="cname" placeholder="반 이름 (예: 6학년 3반)" style="flex:1">
        <select id="cteams">${[1, 2, 3, 4, 5, 6, 7, 8].map(n => `<option value="${n}" ${n === 6 ? 'selected' : ''}>${n}개 모둠</option>`).join('')}</select>
        <button class="pri" id="create">반 만들기 ✨</button></div>
        <p class="muted">한 모둠에 최대 6명까지 들어갈 수 있어요. 학생 30명이면 5~6개 모둠을 추천해요.</p>
      </div>
      <div class="card" style="flex:1;min-width:300px">
        <h2 style="margin-bottom:10px">이 컴퓨터에서 만든 반</h2>
        ${T.list.length ? T.list.map(c => `<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${esc(c.name)}</b> <span class="tag">코드 ${c.code}</span><div class="muted">${new Date(c.at).toLocaleString('ko-KR')}</div></div><div class="row"><button class="pri sm" data-a="open" data-c="${c.code}">열기</button><button class="sm" data-a="forget" data-c="${c.code}">빼기</button></div></div>`).join('') : '<div class="muted">아직 없어요.</div>'}
      </div>
    </div>`;
  }

  /* ───── 관제판 ───── */
  const acc = p => p.correct + p.wrong ? Math.round(p.correct / (p.correct + p.wrong) * 100) : null;
  function vDash() {
    const d = T.data, c = T.cur;
    if (!d) return '<div class="card">불러오는 중…</div>';
    const ps = d.teams.flatMap(t => t.players.map(p => ({ ...p, team: t.team })));
    const tq = ps.reduce((a, p) => a + p.correct + p.wrong, 0), ok = ps.reduce((a, p) => a + p.correct, 0);
    return `<div class="top">
      <div><div class="muted" style="font-weight:800">${esc(d.name)} · 반 코드</div><div class="code">${d.code}</div></div>
      <div style="flex:1;min-width:240px"><div class="muted">학생 접속 주소</div><div style="font-weight:900;font-size:20px">${esc(location.origin)}</div>
        <div class="muted">문제: 9단원 ${d.custom ? '(업로드한 문제 ' : '('}${d.qCount}문제)</div></div>
      <div class="row">
        <button class="gold" data-a="ctl" data-x="start">▶ 모두 시작</button><button data-a="ctl" data-x="pause">⏸ 모두 멈춤</button>
        <button class="red" data-a="ctl" data-x="reset">↻ 모두 새 판</button><button class="pri" data-a="csv">📥 결과 내보내기(엑셀)</button><button data-a="home">🏠 목록</button>
      </div></div>
    ${T.err ? '<div class="card" style="background:#fff6e5;border-color:#ffd68a;margin-bottom:10px">서버와 연결이 잠시 끊겼어요. 다시 연결하는 중…</div>' : ''}
    <div class="chips"><div class="chip"><b>${ps.filter(p => p.online).length}</b>/ ${ps.length}명 접속</div><div class="chip"><b>${tq}</b>문제 풀이</div><div class="chip"><b>${tq ? Math.round(ok / tq * 100) : 0}%</b>전체 정답률</div><div class="chip"><b>${d.teams.filter(t => t.result === 'victory').length}</b>모둠 방어 성공</div></div>
    <div class="tabs">${[['teams', '👀 모둠 현황'], ['students', '🧒 학생별'], ['questions', '📊 문제 분석'], ['big', '📺 큰 화면'], ['upload', '📁 문제 바꾸기']].map(([k, n]) => `<button class="${T.tab === k ? 'on' : ''}" data-a="tab" data-t="${k}">${n}</button>`).join('')}</div>
    ${({ teams: vTeams, students: vStudents, questions: vQuestions, big: vBig, upload: vUpload })[T.tab]()}`;
  }
  function vTeams() {
    return `<div class="teams">${T.data.teams.map(t => `<div class="team">
      <h3>${t.team}모둠 <span class="st ${t.status}">${t.result === 'victory' ? '🏆 성공' : t.result === 'defeat' ? '💥 실패' : STATUS[t.status]}</span></h3>
      <div class="kv"><span>🌊 ${t.wave}/${t.waves}</span><span>❤️ ${t.lives}</span><span>☀️ ${t.tickets}</span><span>💥 ${t.defeated}</span><span>⏱ ${Math.floor(t.elapsed / 60)}:${String(t.elapsed % 60).padStart(2, '0')}</span></div>
      <div class="bar"><i style="width:${t.result === 'victory' ? 100 : (t.wave - 1) / t.waves * 100}%"></i></div>
      ${t.players.length ? t.players.map(p => `<div class="row" style="justify-content:space-between;font-size:14px;padding:2px 0"><span><span class="dot ${p.online ? 'on' : ''}"></span>${esc(p.name)}</span><span>${p.correct}/${p.correct + p.wrong} <b>${acc(p) == null ? '-' : acc(p) + '%'}</b></span></div>`).join('') : '<div class="muted">아직 아무도 없어요</div>'}
      <div class="row" style="margin-top:10px"><button class="sm gold" data-a="ctl" data-x="start" data-t="${t.team}">▶ 시작</button><button class="sm" data-a="ctl" data-x="pause" data-t="${t.team}">⏸</button><button class="sm red" data-a="ctl" data-x="reset" data-t="${t.team}">↻ 새 판</button></div>
    </div>`).join('')}</div>`;
  }
  function vStudents() {
    const ps = T.data.teams.flatMap(t => t.players.map(p => ({ ...p, team: t.team }))).sort((a, b) => a.team - b.team || a.name.localeCompare(b.name, 'ko'));
    return `<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>모둠</th><th>이름</th><th>맞힘</th><th>틀림</th><th>정답률</th><th>모은 태양</th><th>최근 틀린 문제</th></tr></thead><tbody>
      ${ps.map(p => `<tr><td>${p.team}</td><td><span class="dot ${p.online ? 'on' : ''}"></span>${esc(p.name)}</td><td class="ok">${p.correct}</td><td class="no">${p.wrong}</td><td><b>${acc(p) == null ? '-' : acc(p) + '%'}</b></td><td>${p.earned}</td>
        <td style="font-size:13px;color:var(--mute)">${p.log.filter(l => !l.ok).slice(-3).reverse().map(l => esc(l.q)).join('<br>') || '-'}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">아직 학생이 없어요.</td></tr>'}
    </tbody></table></div>`;
  }
  function qStats() {
    const m = {};
    T.data.teams.forEach(t => t.players.forEach(p => p.log.forEach(l => {
      const e = m[l.q] || (m[l.q] = { q: l.q, cat: l.cat, answer: l.answer, n: 0, ok: 0, wrong: {}, who: new Set() });
      e.n++; if (l.ok) e.ok++; else { e.wrong[l.chosen] = (e.wrong[l.chosen] || 0) + 1; e.who.add(`${t.team}모둠 ${p.name}`); }
    })));
    return Object.values(m).sort((a, b) => a.ok / a.n - b.ok / b.n || b.n - a.n);
  }
  function vQuestions() {
    const qs = qStats();
    const cats = {}; qs.forEach(q => { const c = cats[q.cat] || (cats[q.cat] = { n: 0, ok: 0 }); c.n += q.n; c.ok += q.ok; });
    return `<div class="chips">${Object.entries(cats).map(([k, v]) => `<div class="chip"><b>${Math.round(v.ok / v.n * 100)}%</b>${esc(k)}</div>`).join('')}</div>
    <div class="card" style="padding:0;overflow:auto;max-height:70vh"><table><thead><tr><th>분류</th><th>문제</th><th>정답</th><th>푼 횟수</th><th>정답률</th><th>많이 고른 오답</th><th>틀린 학생</th></tr></thead><tbody>
      ${qs.map(q => { const r = Math.round(q.ok / q.n * 100); return `<tr><td><span class="tag">${esc(q.cat)}</span></td><td>${esc(q.q)}</td><td><b>${esc(q.answer)}</b></td><td>${q.n}</td><td class="${r < 60 ? 'no' : 'ok'}">${r}%</td><td style="font-size:13px">${Object.entries(q.wrong).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([w, n]) => `${esc(w)} (${n})`).join('<br>') || '-'}</td><td style="font-size:12px;color:var(--mute)">${esc([...q.who].slice(0, 5).join(', '))}</td></tr>`; }).join('') || '<tr><td colspan="7" class="muted">아직 푼 문제가 없어요. 정답률이 낮은 문제부터 보여요.</td></tr>'}
    </tbody></table></div>`;
  }
  function vBig() {
    const ts = T.data.teams.slice().sort((a, b) => (b.result === 'victory') - (a.result === 'victory') || b.wave - a.wave || b.defeated - a.defeated);
    return `<div class="big"><div style="font-size:22px;opacity:.85">${esc(T.data.name)} · 반 코드</div><div class="code">${T.data.code}</div><div style="font-size:22px;opacity:.9">${esc(location.origin)}</div></div>
      <div class="teams" style="margin-top:14px">${ts.map((t, i) => `<div class="team" style="font-size:20px"><h3>${i < 3 ? ['🥇', '🥈', '🥉'][i] : ''} ${t.team}모둠 <span class="st ${t.status}">${t.result === 'victory' ? '🏆' : STATUS[t.status]}</span></h3><div class="kv" style="font-size:20px"><span>🌊 ${t.wave}/${t.waves}</span><span>❤️ ${t.lives}</span><span>💥 ${t.defeated}</span></div></div>`).join('')}</div>`;
  }
  function vUpload() {
    return `<div class="card"><h2>📁 문제 바꾸기 (선택)</h2>
      <p>기본으로 <b>9단원 문제 ${T.data.custom ? '' : T.data.qCount + '개'}</b>가 들어 있어요. 다른 문제를 쓰고 싶을 때만 CSV 파일을 올리세요.</p>
      <p class="muted">엑셀에서 첫 줄을 <b>문제, 보기1, 보기2, 보기3, 보기4, 정답번호</b>로 만들고 「CSV UTF-8」로 저장해요. 올리면 이 반의 모든 모둠에 바로 적용돼요.</p>
      <div class="row"><input type="file" id="up" accept=".csv,.tsv,.txt"><button data-a="tpl">CSV 예시 받기</button>${T.data.custom ? '<button class="red" data-a="qreset">9단원 기본 문제로 되돌리기</button>' : ''}</div></div>`;
  }

  function render() {
    const a = document.activeElement;
    if (a && a.tagName === 'INPUT' && a.type !== 'file' && T.cur) return;
    $('#root').innerHTML = T.cur ? vDash() : vHome();
  }

  async function open(code) {
    const c = T.list.find(x => x.code === code); if (!c) return;
    T.cur = c; T.data = null; render();
    clearInterval(T.poll);
    const pull = async () => {
      try { T.data = await api(`class/dash?code=${c.code}&token=${c.token}`); T.err = 0; render(); }
      catch (e) {
        T.err++;
        if (e.status === 403) { clearInterval(T.poll); toast('이 반을 찾을 수 없어요. 서버가 다시 시작되면 반이 지워져요. 새 반을 만들어 주세요.'); T.cur = null; render(); }
        else render();
      }
    };
    await pull(); T.poll = setInterval(pull, 2000);
  }
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const d = b.dataset, c = T.cur;
    try {
      if (b.id === 'create' || d.a === 'create') return;
      if (d.a === 'open') return open(d.c);
      if (d.a === 'forget') { T.list = T.list.filter(x => x.code !== d.c); LS.set('rmd.t.classes', T.list); return render(); }
      if (d.a === 'home') { clearInterval(T.poll); T.cur = null; return render(); }
      if (d.a === 'tab') { T.tab = d.t; return render(); }
      if (d.a === 'ctl') {
        if (d.x === 'reset' && !confirm(d.t ? `${d.t}모둠을 처음부터 다시 할까요?` : '모든 모둠을 처음부터 다시 할까요? (학생 기록은 남아요)')) return;
        await api('class/control', { code: c.code, token: c.token, action: d.x, team: d.t ? +d.t : 0 });
        toast({ start: '시작했어요!', pause: '멈췄어요.', reset: '새 판을 준비했어요.' }[d.x]); return;
      }
      if (d.a === 'csv') return exportCsv();
      if (d.a === 'tpl') return download('garden_questions.csv', '﻿문제,보기1,보기2,보기3,보기4,정답번호\nHow can I ___ to the zoo?,get,go,take,come,1\nbetween의 뜻은?,~ 옆에,~ 사이에,~ 앞에,~ 뒤에,2\n');
      if (d.a === 'qreset') { await api('class/questions', { code: c.code, token: c.token, reset: true }); toast('9단원 기본 문제로 되돌렸어요.'); return; }
    } catch (err) { toast(err.message); }
  });
  document.addEventListener('click', async e => {
    if (e.target.id !== 'create') return;
    try {
      const name = $('#cname').value.trim() || '우리 반';
      const d = await api('class/create', { name, teams: +$('#cteams').value });
      T.list.unshift({ code: d.code, token: d.token, name, at: Date.now() }); LS.set('rmd.t.classes', T.list);
      toast('반을 만들었어요! 학생들에게 반 코드를 알려 주세요.'); open(d.code);
    } catch (err) { toast(err.message); }
  });
  document.addEventListener('change', async e => {
    if (e.target.id !== 'up') return;
    const f = e.target.files[0]; if (!f) return;
    try {
      const text = (await f.text()).replace(/^﻿/, '');
      const rows = parseCSV(text, text.includes('\t') ? '\t' : ',');
      const qs = rows.slice(1).filter(r => r[0]).map(r => ({ q: r[0], opts: [r[1], r[2], r[3], r[4]].map(x => String(x || '').trim()), answer: Number(r[5]) - 1 }));
      const d = await api('class/questions', { code: T.cur.code, token: T.cur.token, questions: qs });
      toast(`문제 ${d.count}개로 바꿨어요.`);
    } catch (err) { toast('올리기 실패: ' + err.message + ' (엑셀 파일이면 「CSV UTF-8」로 저장해서 올려 주세요)'); }
  });
  function parseCSV(text, sep) { const rows = []; let row = [], v = '', q = false; for (let i = 0; i < text.length; i++) { const ch = text[i]; if (ch === '"') { if (q && text[i + 1] === '"') { v += '"'; i++; } else q = !q; } else if (ch === sep && !q) { row.push(v); v = ''; } else if ((ch === '\n' || ch === '\r') && !q) { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(v); if (row.some(x => x.trim())) rows.push(row); row = []; v = ''; } else v += ch; } row.push(v); if (row.some(x => x.trim())) rows.push(row); return rows; }
  function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
  function exportCsv() {
    const cell = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    const lines = [['[학생별 요약]'], ['모둠', '이름', '맞힘', '틀림', '정답률(%)', '모은 태양', '자주 틀린 문제']];
    T.data.teams.forEach(t => t.players.forEach(p => lines.push([t.team, p.name, p.correct, p.wrong, acc(p) ?? '', p.earned, [...new Set(p.log.filter(l => !l.ok).map(l => l.q))].slice(0, 5).join(' / ')])));
    lines.push([], ['[문제별 정답률]'], ['분류', '문제', '정답', '푼 횟수', '맞힌 횟수', '정답률(%)', '많이 고른 오답', '틀린 학생']);
    qStats().forEach(q => lines.push([q.cat, q.q, q.answer, q.n, q.ok, Math.round(q.ok / q.n * 100), Object.entries(q.wrong).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([w, n]) => `${w}(${n})`).join(', '), [...q.who].join(', ')]));
    lines.push([], ['[전체 풀이 기록]'], ['모둠', '이름', '시각', '분류', '문제', '정답', '고른 답', '결과', '걸린 시간(초)']);
    T.data.teams.forEach(t => t.players.forEach(p => p.log.forEach(l => lines.push([t.team, p.name, new Date(l.t).toLocaleString('ko-KR'), l.cat, l.q, l.answer, l.chosen, l.ok ? 'O' : 'X', Math.round(l.ms / 100) / 10]))));
    const dt = new Date(), stamp = `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, '0')}${String(dt.getDate()).padStart(2, '0')}`;
    download(`가든디펜스_${T.data.name.replace(/[\\/:*?"<>|]/g, '')}_${stamp}.csv`, '﻿' + lines.map(r => r.map(cell).join(',')).join('\r\n'));
  }
  render();
  window.__T = T;
})();
